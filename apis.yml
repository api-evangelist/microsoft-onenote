      - Office 365
      - Pages
      - Productivity
      - Sections
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    baseURL: https://graph.microsoft.com/v1.0/
    humanURL: https://learn.microsoft.com/en-us/graph/integrate-with-onenote
    properties:
      - url: https://learn.microsoft.com/en-us/graph/integrate-with-onenote
        type: Documentation
      - url: https://learn.microsoft.com/en-us/graph/api/resources/onenote-api-overview
        type: Reference
      - url: https://learn.microsoft.com/en-us/graph/onenote-get-started
        type: GettingStarted
      - url: openapi/microsoft-onenote-openapi.yml
        type: OpenAPI
    description: >-
      The Microsoft Graph OneNote API provides programmatic access to OneNote notebooks, sections, section groups, and
      pages stored in OneDrive or SharePoint. Developers can create, read, update, and delete notebook content, extract
      text from images using OCR, perform full-text search, and sync changes across devices.
